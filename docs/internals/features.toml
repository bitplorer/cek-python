# Features registry (curated). scripts/codemap.py validates every reference:
# modules must be mapped, ``symbols`` (``module:Name`` or ``module:Class.method``)
# must resolve, and ``tests`` / ``docs`` paths must exist. The validated entries
# are folded into codemap/index.json, and each module shard lists its features.
# Edit this file in the same PR that moves a feature. See CODEMAP.md.
#
# Sources: README.md, START.md, docs/ORGANIZATION.md ("What goes where"),
# docs/INVARIANTS.md, docs/CATALOG_AUTHORITY_TARGET.md, docs/COMPOSITION.md,
# cek-surface/ARCHITECTURE.md, and the code.

# ------------------------------------------------------------------ cek-host

[[feature]]
id = "cap-mint-verify"
purpose = "Mint HMAC Caps bound to an action, sealed args, a validity window and optional subject, scopes and once; verify them and attenuate (narrow only)."
modules = ["cek_host.cap", "cek_host.host", "cek_host.digest"]
symbols = [
  "cek_host.cap:CapService",
  "cek_host.cap:CapService.mint",
  "cek_host.cap:CapService.verify",
  "cek_host.cap:CapService.attenuate",
  "cek_host.cap:CapError",
  "cek_host.cap:resource_of",
  "cek_host.cap:scope_allows",
  "cek_host.digest:args_hash",
  "cek_host.host:Host.mint",
  "cek_host.host:Host.attenuate",
  "cek_host.host:Host.check",
]
tests = [
  "cek-surface/tests/test_core.py",
  "cek-surface/tests/test_hardening.py",
  "cek-surface/tests/test_contract_vectors.py",
]
docs = ["START.md", "cek-host/README.md", "docs/INVARIANTS.md"]

[[feature]]
id = "once-single-use"
purpose = "A once-Cap is consumed before lineage or an idempotent record; a second use refuses and a store that is down fails closed."
modules = ["cek_host.once", "cek_host.host"]
symbols = [
  "cek_host.once:OnceBackend",
  "cek_host.once:MemoryOnceBackend",
  "cek_host.once:FileOnceBackend",
  "cek_host.once:OnceUsed",
  "cek_host.once:StoreDown",
  "cek_host.cap:CapService.commit_once",
  "cek_host.host:Host._finish",
]
tests = [
  "cek-surface/tests/test_host_parity.py",
  "cek-surface/tests/test_hardening.py",
  "cek-surface/tests/test_continuation_bag.py",
]
docs = ["docs/INVARIANTS.md", "CHANGELOG.md"]

[[feature]]
id = "verify-policy"
purpose = "Post-Cap verify gates: accepted law generations, Ed25519 signatures when the Host holds a seed, and the BoundAsk token that only exists after verify."
modules = ["cek_host.host_verify", "cek_host.ed25519", "cek_host.bound", "cek_host.host"]
symbols = [
  "cek_host.host_verify:check_generation",
  "cek_host.host_verify:check_ed25519",
  "cek_host.ed25519:sign",
  "cek_host.ed25519:verify",
  "cek_host.ed25519:public_key",
  "cek_host.bound:BoundAsk",
  "cek_host.host:Host._verify",
]
tests = [
  "cek-surface/tests/test_phase2.py",
  "cek-surface/tests/test_contract_vectors.py",
]
docs = ["docs/INVARIANTS.md"]

[[feature]]
id = "idempotency-bind"
