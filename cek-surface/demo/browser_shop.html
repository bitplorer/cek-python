<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>cek-surface browser shop</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    #cart { margin: 1rem 0; font-weight: 600; }
    #results { list-style: none; padding: 0; }
    #results li { padding: 0.4rem 0; border-bottom: 1px solid #eee; }
    .pending { opacity: 0.6; }
    #toast { position: fixed; bottom: 1rem; right: 1rem; background: #111; color: #fff; padding: 0.6rem 1rem; border-radius: 6px; display: none; }
    button { margin-right: 0.4rem; }
  </style>
</head>
<body>
  <h1>Shop <small id="carrier-label"></small></h1>
  <input id="search-input" placeholder="Search (coalesce + flush on Enter)" style="width:100%;padding:0.5rem" />
  <p id="search-status"></p>
  <ul id="results"></ul>
  <div id="cart">Cart: 0</div>
  <div>
    <button id="add-1" type="button">Add Widget</button>
    <button id="checkout" type="button">Checkout</button>
  </div>
  <div id="shell"></div>
  <div id="toast"></div>

  <script type="module">
    /**
     * Demo uses in-page Host bridge via fetch to a tiny local server,
     * or offline mock when ?mock=1.
     * Peer IR: coalesce/flush on the search input.
     */
    import { mountBrowserPeer } from '../js/browser_peer.mjs';

    const mock = new URLSearchParams(location.search).has('mock');
    document.getElementById('carrier-label').textContent = mock ? '(mock peer IR)' : '(wire to Host)';

    const log = [];
    const peer = mountBrowserPeer({
      coalesceMs: 50,
      send: (msg) => {
        // events from peer → would go to Host
        if (msg.type === 'events') {
          console.log('peer events', msg.events);
        }
      },
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }

    async function hostSubmit(action, args) {
      if (mock) {
        // Local mock Result for UX demo without server
        if (action === 'search.type' || action === 'search.commit') {
          const q = (args.q || '').toLowerCase();
          const items = [
            { id: 'sku-1', title: 'Widget Basic', price: 9.99 },
            { id: 'sku-2', title: 'Widget Pro', price: 29.99 },
          ].filter((x) => !q || x.title.toLowerCase().includes(q));
          const result = {
            kind: 'ok',
            ops: [
              { ns: 'ui.dom', name: 'morph', payload: {
                target: 'results',
                patch: { tag: 'ul', children: items.map((it) => ({ tag: 'li', text: it.title + ' — $' + it.price })) },
              }},
              { ns: 'ui', name: 'toast', payload: { message: 'Found ' + items.length, level: 'success', ms: 1500 } },
            ],
          };
          peer.onMessage({ type: 'apply', result });
          document.getElementById('results').innerHTML = items.map((it) =>
            `<li>${it.title} — $${it.price}</li>`).join('');
          document.getElementById('search-status').textContent = items.length + ' hits';
          document.getElementById('search-input').classList.remove('pending');
          showToast('Found ' + items.length);
          return;
        }
        if (action === 'cart.add') {
          showToast('Added (mock)');
          document.getElementById('cart').textContent = 'Cart: 1 · $9.99';
          return;
        }
        if (action === 'checkout.submit') {
          document.getElementById('shell').textContent = 'Order placed (mock)';
          showToast('Order placed');
          return;
        }
        return;
      }
      const res = await fetch('/cek/submit', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, args }),
      });
      const data = await res.json();
      peer.onMessage({ type: 'apply', result: data.result });
    }

    peer.bindSearchInput(document.getElementById('search-input'), {
      action: 'search.type',
      submitIntent: (action, args) => {
        document.getElementById('search-input').classList.add('pending');
        hostSubmit(action, args);
      },
    });

    document.getElementById('add-1').onclick = () =>
      hostSubmit('cart.add', { id: 'sku-1', title: 'Widget Basic', price: 9.99 });
    document.getElementById('checkout').onclick = () =>
      hostSubmit('checkout.submit', { email: 'buyer@example.com' });

    // boot
    hostSubmit('shop.boot', {});
  </script>
</body>
</html>
