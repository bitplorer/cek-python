<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CEK Shop</title>
  <style>
    :root {
      --ink: #1a1814;
      --paper: #f3efe4;
      --card: #fffdf6;
      --line: #d9d0bf;
      --mute: #6b6458;
      --good: #1f6b4a;
      --bad: #9b2c2c;
      --pending: #8a6a22;
      --tap: 44px;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0 auto;
      padding: 1rem 1rem 5.5rem;
      max-width: 40rem;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background: var(--paper);
    }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
    h1 { font-size: 1.55rem; letter-spacing: -0.03em; margin: 0 0 0.25rem; }
    h1 small { font-weight: 500; color: var(--mute); font-size: 0.85rem; }
    #search-input {
      width: 100%;
      min-height: var(--tap);
      margin-top: 1rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      font: inherit;
    }
    #search-status { min-height: 1.25rem; color: var(--mute); font-size: 0.92rem; margin: 0.4rem 0 0; }
    #search-input.pending { outline: 2px dashed var(--pending); }
    #results { list-style: none; padding: 0; margin: 0.5rem 0 0; }
    #results li, #catalog article {
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--line);
      min-height: var(--tap);
    }
    #empty, #error {
      display: none;
      margin: 0.75rem 0;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--line);
    }
    #empty.is-on, #error.is-on { display: block; }
    #error { border-color: #e4b4b4; color: var(--bad); }
    #error strong { display: block; margin-bottom: 0.25rem; }
    #cart { margin: 1rem 0 0.5rem; font-weight: 700; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button {
      min-height: var(--tap);
      min-width: var(--tap);
      padding: 0.55rem 1rem;
      border: 0;
      border-radius: 10px;
      background: var(--good);
      color: #fff;
      font: 650 1rem/1 system-ui, sans-serif;
      cursor: pointer;
    }
    button.secondary { background: var(--ink); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #toast {
      position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
      max-width: calc(100vw - 2rem);
      background: var(--ink); color: var(--paper);
      padding: 0.65rem 1rem; border-radius: 8px; display: none;
    }
    #shell { margin-top: 1rem; }
    @media (max-width: 390px) {
      body { padding: 0.75rem 0.75rem 5.5rem; }
      h1 { font-size: 1.3rem; }
      button { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Shop <small id="carrier-label"></small></h1>
  </header>
  <input id="search-input" placeholder="Search the catalog" autocomplete="off" />
  <p id="search-status">Type to search. Empty query shows the empty state.</p>
  <div id="empty">No matches. Try “widget” or “gadget”.</div>
  <div id="error"><strong>Host refused</strong><span id="error-detail"></span></div>
  <ul id="results"></ul>
  <div id="catalog"></div>
  <div id="cart">Cart: 0</div>
  <div class="row">
    <button id="add-1" type="button">Add Widget</button>
    <button id="buy-once" type="button">Buy once</button>
    <button id="checkout" class="secondary" type="button">Checkout</button>
  </div>
  <div id="shell"></div>
  <div id="toast"></div>

  <script type="module">
    import { mountBrowserPeer } from '../js/browser_peer.mjs';

    const mock = new URLSearchParams(location.search).has('mock');
    document.getElementById('carrier-label').textContent = mock ? '(mock peer IR)' : '(Host wire)';

    const emptyEl = document.getElementById('empty');
    const errorEl = document.getElementById('error');
    const errorDetail = document.getElementById('error-detail');
    const statusEl = document.getElementById('search-status');
    const searchEl = document.getElementById('search-input');
    const buyOnce = document.getElementById('buy-once');
    let onceSpent = false;
    let searched = false;

    function showEmpty(on) { emptyEl.classList.toggle('is-on', on); }
    function showError(msg) {
      errorEl.classList.toggle('is-on', Boolean(msg));
      errorDetail.textContent = msg || '';
    }

    async function teach(err) {
      try {
        const r = await fetch('/cek/explain?q=' + encodeURIComponent(err || 'cap required'));
        const d = await r.json();
        return (d.fix || err || '');
      } catch {
        return err || '';
      }
    }

    async function mintCap(action, args, once) {
      const res = await fetch('/cek/mint', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, args: args || {}, once: Boolean(once) }),
      });
      const data = await res.json();
      if (!data.cap) throw new Error(data.error || 'mint failed');
      return data.cap;
    }

    async function hostSubmit(action, args, cap) {
      showError('');
      args = { ...(args || {}) };
      const once = Boolean(args._once);
      delete args._once;
      if (mock) {
        if (action === 'search.type' || action === 'search.commit') {
          const q = (args.q || '').toLowerCase();
          const items = [
            { id: 'sku-1', title: 'Widget Basic', price: 9.99 },
            { id: 'sku-2', title: 'Widget Pro', price: 29.99 },
          ].filter((x) => !q || x.title.toLowerCase().includes(q));
          const result = {
            kind: 'ok',
            ops: [
              { ns: 'ui.dom', name: 'morph', payload: {
                target: 'results',
                patch: { tag: 'ul', children: items.map((it) => ({ tag: 'li', text: it.title + ' — $' + it.price })) },
              }},
              { ns: 'ui', name: 'toast', payload: { message: 'Found ' + items.length, level: 'success', ms: 1500 } },
            ],
          };
          peer.onMessage({ type: 'apply', result });
          statusEl.textContent = items.length + ' hits';
          searchEl.classList.remove('pending');
          showEmpty(items.length === 0);
          return;
        }
        return;
      }
      if (!cap) cap = await mintCap(action, args, once);
      const res = await fetch('/cek/submit', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, args, cap }),
      });
      const data = await res.json();
      peer.onMessage({
        type: 'apply',
        result: data.result,
        continuations: data.continuations || data.result?.continuations || [],
      });
      const ops = data.result?.ops || [];
      const morph = ops.find((o) => o.ns === 'ui.dom' && o.name === 'morph' && o.payload?.target === 'results');
      const n = morph?.payload?.patch?.children?.length;
      if (typeof n === 'number' && searched) {
        statusEl.textContent = n + ' hits';
        searchEl.classList.remove('pending');
        showEmpty(n === 0);
      }
      if (data.result?.kind && data.result.kind !== 'ok') {
        const taught = await teach(data.result.error || data.result.kind);
        statusEl.textContent = data.result.error || data.result.kind;
        showError(taught);
        if ((data.result.error || '').toLowerCase().includes('once')) {
          onceSpent = true;
          buyOnce.disabled = true;
          buyOnce.textContent = 'Once used';
        }
      }
    }

    const peer = mountBrowserPeer({
      coalesceMs: 50,
      submitIntent: (action, args, cap) => hostSubmit(action, args, cap),
      send: (msg) => {
        if (msg.type === 'events') console.log('peer events', msg.events);
      },
    });

    peer.bindSearchInput(searchEl, {
      action: 'search.type',
      submitIntent: (action, args, cap) => {
        const q = String((args && args.q) || '').trim();
        searched = true;
        if (!q) {
          searchEl.classList.remove('pending');
          statusEl.textContent = 'Type to search.';
          showEmpty(true);
          hostSubmit(action, args, cap);
          return;
        }
        searchEl.classList.add('pending');
        statusEl.textContent = 'Searching…';
        showEmpty(false);
        hostSubmit(action, args, cap);
      },
    });

    document.getElementById('add-1').onclick = () =>
      hostSubmit('cart.add', { id: 'sku-1', title: 'Widget Basic', price: 9.99 });

    buyOnce.onclick = async () => {
      if (onceSpent) return;
      buyOnce.disabled = true;
      try {
        const cap = await mintCap('cart.add', { id: 'sku-2', title: 'Widget Pro', price: 29.99 }, true);
        await hostSubmit('cart.add', { id: 'sku-2', title: 'Widget Pro', price: 29.99 }, cap);
        onceSpent = true;
        buyOnce.textContent = 'Once used';
      } catch (err) {
        buyOnce.disabled = false;
        showError(String(err.message || err));
      }
    };

    document.getElementById('checkout').onclick = () =>
      hostSubmit('checkout.submit', { email: 'buyer@example.com' });

    hostSubmit('shop.boot', {});
  </script>
</body>
</html>
