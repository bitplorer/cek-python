[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cek-surface"
version = "0.1.0"
description = "CEK surface runtime: Python compose, Result.ops wire, Peer IR, portable carriers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bitplorer" }]
dependencies = [
  "cek-host>=0.1.0",
]

[project.optional-dependencies]
ws = ["websockets>=12.0"]
dev = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/bitplorer/cek-python"
Law = "https://github.com/bitplorer/cek-framework"
Rust = "https://github.com/bitplorer/cek-runtime"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cek_surface = ["py.typed"]
