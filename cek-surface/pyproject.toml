[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cek-surface"
version = "0.1.2"
description = "CEK surface: compose Ops, Peer IR, carriers. Depends on cek-host."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "bitplorer" }]
dependencies = [
  "cek-host>=0.1.2",
]

[project.optional-dependencies]
ws = ["websockets>=12.0"]
dev = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/bitplorer/cek-python"
Law = "https://github.com/bitplorer/cek-framework"
Rust = "https://github.com/bitplorer/cek-runtime"
Start = "https://github.com/bitplorer/cek-python/blob/main/START.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cek_surface = ["py.typed", "js/*.mjs", "stdlibs/*.json"]
