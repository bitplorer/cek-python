name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cek-python
      - uses: actions/checkout@v4
        with:
          repository: bitplorer/cek-runtime
          path: cek-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: editable install
        working-directory: cek-python
        run: |
          pip install -e ./cek-host -e ./cek-surface
          # Host entry point is also named `cek`. Leftover wrap tests treat
          # PATH `cek` as Rust cek-cli (`apply` / `host-json`) and must skip
          # when that binary is not built.
          rm -f "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/cek"
      - name: import smoke
        working-directory: cek-python
        run: python -c "from cek_host import Host; from cek_surface import Surface, Op; print('ok')"
      - name: test suite
        working-directory: cek-python
        run: sh scripts/verify.sh
