# Publish cek-host + cek-surface 0.1.0 to TestPyPI via Trusted Publishing.
#
# GitHub Environments (already created):
#   testpypi-host    → cek-host
#   testpypi-surface → cek-surface
#
# TestPyPI pending / trusted publishers (must match env names):
#   cek-host:
#     Owner: bitplorer  Repo: cek-python
#     Workflow: publish-testpypi.yml  Environment: testpypi-host
#   cek-surface:
#     Owner: bitplorer  Repo: cek-python
#     Workflow: publish-testpypi.yml  Environment: testpypi-surface
#
# See docs/TESTPYPI_SETUP.md
#
# Trigger: workflow_dispatch or push of tag v0.1.0*

name: publish-testpypi

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.0*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install build tools
        run: pip install build twine
      - name: build
        run: |
          python -m build --outdir dist cek-host
          python -m build --outdir dist cek-surface
          python -m twine check dist/*
          mkdir -p dist-host dist-surface
          cp dist/cek_host-* dist-host/
          cp dist/cek_surface-* dist-surface/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-host
          path: dist-host/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-surface
          path: dist-surface/

  publish-host:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi-host
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-host
          path: dist-host
      - name: publish cek-host to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-host/

  publish-surface:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi-surface
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-surface
          path: dist-surface
      - name: publish cek-surface to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-surface/
